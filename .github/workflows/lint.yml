name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sh scripts/install-lint-tools.sh
      - run: make lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # lychee uses it to avoid GitHub rate limits
