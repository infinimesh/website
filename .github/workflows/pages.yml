name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh API spec from infinimesh/proto
        run: |
          if curl -fsSL https://raw.githubusercontent.com/infinimesh/proto/main/api.swagger.json -o /tmp/spec.json; then
            cp /tmp/spec.json api/openapi.json
          else
            echo "proto spec not reachable, keeping the committed copy"
          fi
      - name: Build the site folder without repo tooling
        run: |
          mkdir _site
          rsync -a \
            --exclude .git --exclude .github --exclude _site \
            --exclude Makefile --exclude scripts/ \
            --exclude lychee.toml --exclude .htmlhintrc --exclude .yamllint.yml \
            --exclude .gitignore \
            ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
